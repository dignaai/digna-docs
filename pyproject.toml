[tool.poetry]
name = "digna-docs"
version = "0.1.0"
description = ""
authors = ["Marcin Chudeusz <marcin.chudeusz@digna.ai>", "Danijel Kivaranovic <danijel.kivaranovic@digna.ai>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
# The "imaging" extra (cairosvg + pillow) powers the social-card plugin.
# It also needs system libraries: see .github/workflows for CI, and
# `brew install cairo freetype libffi libjpeg libpng` for local previews.
mkdocs-material = {version = "^9.6.19", extras = ["imaging"]}
mkdocs-ultralytics-plugin = "^0.1.30"
mkdocs-static-i18n = "^1.3.0"
openai = "^2.6.0"
typer = "^0.20.0"
css-html-js-minify = "^2.5.5"
mkdocs-minify-plugin = "^0.8.0"
mkdocs-git-revision-date-localized-plugin = "^1.2.9"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
