name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - master
  # Lets the deploy be started by hand from the Actions tab, against whatever
  # master currently points at. Without it the only trigger is a push, so a run
  # that never fired can only be replaced by pushing again — and re-running an
  # old run just redeploys that old commit.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # git-revision-date-localized derives each page's "Last update" from
          # that file's commit history. The default shallow clone has none, so
          # every page silently fell back to the build date.
          fetch-depth: 0

      # The SDK API pages under docs/sdk/** are generated at build time by
      # mkdocstrings from the digna-sdk source. mkdocs.yml points the python
      # handler at ../digna-sdk/src, so the SDK repo must sit next to this one.
      # Adjust `repository`/`ref` to your SDK repo (and add a token via `with:
      # token:` if it is private).
      - name: Checkout digna-sdk
        uses: actions/checkout@v4
        with:
          repository: dignaai/digna-sdk
          ref: main
          path: digna-sdk

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      # cairosvg is a binding to the system Cairo library; the wheel alone is
      # not enough. Required by the social-card plugin.
      - name: Install imaging libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libfreetype6 libffi-dev libjpeg-dev libpng-dev

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      # Social cards are expensive to render and change only when a page's
      # title or the card layout does, so reuse them between runs.
      - name: Restore social-card cache
        uses: actions/cache@v4
        with:
          key: mkdocs-social-${{ hashFiles('mkdocs.yml') }}-${{ github.sha }}
          restore-keys: |
            mkdocs-social-${{ hashFiles('mkdocs.yml') }}-
            mkdocs-social-
          path: .cache

      - name: Build and deploy
        env:
          CI: "true"
        run: poetry run mkdocs gh-deploy --force
