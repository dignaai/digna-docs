extra:
  generator: false

  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/dignaai/?viewAsMember=true
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/digna_ai
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@digna_ai
    - icon: fontawesome/brands/facebook
      link: https://facebook.com/dignaai
    - icon: fontawesome/solid/paper-plane
      link: mailto:office@digna.ai

copyright: >
    © 2025 digna GmbH — <a href="https://www.digna.ai" target="_blank" rel="noopener">www.digna.ai</a>

markdown_extensions:
  - abbr                  # *[SSO]: Single Sign-on  ->  tooltip on every mention
  - admonition
  - attr_list             # lets us add .md-button, .cards, .grid in Markdown
  - def_list
  - footnotes
  - md_in_html            # required for the "grid cards" layout used on landing pages
  - tables
  # NB: pymdownx.betterem is deliberately NOT enabled. Several pages use
  # nested emphasis of the form `**Extracting the ***digna*** CLI:**`,
  # which betterem renders as literal asterisks while Python-Markdown's
  # default smart_emphasis parses it as intended.
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true     # line numbers become linkable anchors
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys           # ++ctrl+c++ renders as keyboard keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true   # required by the content.tabs.link theme feature
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true   # anchor link on every heading, so sections are shareable
      toc_depth: 3      # H1-H3 in the right-hand table of contents

extra_css:
  - style/extra.css

