site_name: digna Documentation
site_author: digna GmbH
site_description: Official documentation for digna, the European AI-powered Data Quality and Data Observability platform. Learn how to install, configure, and integrate digna, connect databases, and use modules such as Data Anomalies, Data Analytics, Data Validation, Timeliness, and Schema Tracker.
site_url: https://docs.digna.ai
theme:
  language: en
  logo: assets/digna.png
  favicon: assets/favicon.ico
  name: material
  custom_dir: overrides
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky  # keep the section tabs visible while scrolling
    - navigation.sections
    - navigation.path         # breadcrumbs (Insiders gives extra options, but not required)
    - navigation.top          # back-to-top button
    - navigation.tracking     # reflect the active anchor in the address bar
    - navigation.footer       # next/previous page links
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips        # styled tooltips for title="" and abbreviations
    - search.highlight
    - search.suggest
    - search.share
    - navigation.indexes
    - toc.follow  # Highlights current section

extra_javascript:
  - assets/javascripts/clarity.js
  - assets/javascripts/feedback.js

nav:
  - "": index.md
  - Platform:
      - Overview: platform/overview.md
      - digna Data Anomalies:
          - Introduction: platform/data_anomalies/Introduction.md
      - digna Data Analytics:
          - Introduction: platform/data_analytics/Introduction.md
      - digna Data Validation:
          - Introduction: platform/data_validation/Introduction.md
      - digna Timeliness:
          - Introduction: platform/data_timeliness/Introduction.md
      - digna Schema Tracker:
          - Introduction: platform/schema_tracker/Introduction.md
  - Installation & Deployment:
      - Windows:
          - Release 2026.06: installation_deployment/Windows/Release 2026.06/installation_guide_digna_windows_2026_06.md
      - How to configure Single Sign-on: installation_deployment/sso_integration_guide.md
  - Getting Started:
      - First steps:
          - How to create a data project: getting_started/how_to_create_project.md
          - How to connect a database to data project: getting_started/how_to_connect_database_to_data_project.md
          - How to add a datasource to project: getting_started/how_to_add_a_datasource_to_project.md
      - Scheduling:
          - How to schedule a daily job: getting_started/how_to_schedule_a_daily_job.md
          - How to use crontab definition: getting_started/how_to_use_crontab.md
  - Integration:
      - Databases:
          - Azure Synaps: databases/azure_synapse_connector_guide.md
          - Databricks: databases/databricks_connector_guide.md
          - Databricks Legacy: databases/databricks_legacy_connector_guide.md
          - Hive: databases/hive_connector_guide.md
          - Netezza: databases/netezza_connector_guide.md
          - Oracle: databases/oracle_connector_guide.md
          - PostgreSQL: databases/postgres_connector_guide.md
          - Snowflake: databases/snowflake_connector_guide.md
          - MS SQL Server: databases/sqlserver_connector_guide.md
          - Teradata: databases/teradata_connector_guide.md
  - CLI Reference:
          - Introduction: cli/Introduction.md
          - Release 2026.04: cli/Command_Line_Interface_202604.md
          - Release 2026.01: cli/Command_Line_Interface_202601.md
          - Release 2025.09: cli/Command_Line_Interface_202509.md
          - Release 2025.04: cli/Command_Line_Interface_202504.md
          - Release 2024.12: cli/Command_Line_Interface_202412.md
          - Release 2024.11: cli/Command_Line_Interface_202411.md
          - Release 2024.09: cli/Command_Line_Interface_202409.md

  - Changelog:
          - Release 2026.06: changelog/Release_202606.md
          - Release 2026.04: changelog/Release_202604.md
          - Release 2026.01: changelog/Release_202601.md
          - Release 2025.09: changelog/Release_202509.md
          - Release 2025.04: changelog/Release_202504.md
          - Release 2024.12: changelog/Release_202412.md

