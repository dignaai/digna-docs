site_name: digna Docs
site_url: https://digna.ai
#repo_url: https://github.com/digna-ai/digna-docs

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky

  palette:

    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - digna: index.md

  - Getting Started:
    - Getting Started: getting-started/index.md
    - Second Step: getting-started/first-step.md
    - First Step: getting-started/second-step.md

  - Advanced:
    - Advanced: advanced/index.md
    - Secrets: advanced/secrets.md
    - More Secrets: advanced/more-secrets.md
